# Computer-use playbooks + vision defaults.
# Edufun khớp match → strategy scripted; URL khác → vision CU.

playbooks:
  edufun_standup:
    match:
      hosts:
        - portal-cohort5.edufun.ai
      path_prefix: /my-submissions
    strategy: scripted
    # Edufun portal: mỗi field tối thiểu 40 ký tự (trim).
    min_chars: 40
    fields:
      yesterday:
        selector: "#standup-yesterday, textarea[name='yesterday'], [data-field='yesterday']"
        label_contains: "Hôm qua"
      today:
        selector: "#standup-today, textarea[name='today'], [data-field='today']"
        label_contains: "Hôm nay"
      blockers:
        selector: "#standup-blocker, textarea[name='blockers'], [data-field='blockers']"
        label_contains: "Đang vướng"
    submit_selector: "button:has-text('Nộp standup'), button:has-text('Cập nhật standup'), button[type='submit']"
    success_patterns:
      - "Đã nộp daily standup"
      - "đã nộp"
      - "submitted"
      - "success"
    form_ready_selector: "#standup-yesterday"

vision:
  max_steps: 12
  login_url_patterns:
    - "/login"
    - "/signin"
    - "/oauth/"
    - "oauth/authorize"
    - "accounts.google.com"
    - "github.com/login"
    - "login.microsoftonline.com"
